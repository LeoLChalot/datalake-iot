services:
   postgres-db:
      image: postgres:17
      container_name: postgres-db
      restart: unless-stopped
      environment:
         POSTGRES_USER: myuser
         POSTGRES_PASSWORD: mypassword
         POSTGRES_DB: mydatabase
      ports:
         - "5432:5432"
      volumes:
         - postgres-data:/var/lib/postgresql/data
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
         interval: 5s
         timeout: 5s
         retries: 5
      networks:
         - data-network

   metabase:
      image: metabase/metabase:latest
      container_name: metabase
      restart: unless-stopped
      ports:
         - "3000:3000"
      environment:
         MB_DB_TYPE: postgres
         MB_DB_DBNAME: mydatabase
         MB_DB_PORT: 5432
         MB_DB_USER: myuser
         MB_DB_PASS: mypassword
         MB_DB_HOST: postgres-db
      depends_on:
         postgres-db:
            condition: service_healthy
      networks:
         - data-network

   minio:
      image: cgr.dev/chainguard/minio:latest
      container_name: minio
      restart: unless-stopped
      user: "0:0"
      command: server /data --console-address ":9001"
      environment:
         MINIO_ROOT_USER: minioadmin
         MINIO_ROOT_PASSWORD: minioadmin123
      ports:
         - "9000:9000" # API S3 (utilisée par Python)
         - "9001:9001" # Console web
      volumes:
         - minio_data:/data
      networks:
         - data-network

   citybikes-collector:
      image: python:3.13-alpine
      container_name: citybikes-collector
      restart: unless-stopped
      command: sh -c "apk add --no-cache curl > /dev/null && python -u /app/citybikes-collector.py"
      environment:
         MINIO_URL: http://minio:9000/datalake-citybikes
      volumes:
         - ./partie-2:/app:ro
      depends_on:
         - minio
      networks:
         - data-network

volumes:
   postgres-data:
   minio_data:

networks:
   data-network:
      driver: bridge
